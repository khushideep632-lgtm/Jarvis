plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myagent.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "com.myagent.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
